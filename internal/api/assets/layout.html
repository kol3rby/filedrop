{{define "style"}}
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --border:#d0d7de; --code:#f6f8fa; --link:#0969da; --danger:#cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8d96a0; --border:#30363d; --code:#161b22; --link:#4493f8; --danger:#f85149; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  a { color: var(--link); }
  h1, h2, h3 { line-height: 1.25; }
  h1 { border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  h2 { border-bottom: 1px solid var(--border); padding-bottom: .3em; margin-top: 2em; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
  code { background: var(--code); padding: .1em .35em; border-radius: 4px; }
  pre { background: var(--code); padding: 12px 16px; border-radius: 6px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; margin: 1em 0; }
  th, td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; vertical-align: top; }
  th { background: var(--code); }
  .muted { color: var(--muted); }
  button.delete { background: none; border: 1px solid var(--danger); color: var(--danger); border-radius: 6px; padding: 2px 10px; cursor: pointer; font: inherit; font-size: 14px; }
  button.delete:hover { background: var(--danger); color: var(--bg); }
  .dropzone { display: block; margin: 1em 0; padding: 24px 16px; border: 2px dashed var(--border); border-radius: 8px; text-align: center; cursor: pointer; }
  .dropzone:hover, .dropzone:focus-within, .dropzone.over { border-color: var(--link); background: var(--code); }
  .dropzone input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .dropzone span { display: block; font-size: 14px; }
  .uploads { list-style: none; padding: 0; margin: 0; }
  .uploads li { display: flex; gap: 12px; align-items: center; font-size: 14px; }
  .uploads li span { overflow-wrap: anywhere; }
  .uploads li.done span::after { content: " ✓"; }
  .uploads li.error { color: var(--danger); }
</style>
{{end}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
{{template "style"}}
</head>
<body>
<main>
{{.Content}}
</main>
</body>
</html>
